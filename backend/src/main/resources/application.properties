spring.application.name=backend
server.port=8090

# Ticketmaster API
ticketmaster.api.base-url=https://app.ticketmaster.com/discovery/v2
ticketmaster.api.key=${TMKey:}

# Datenbank Verbindung
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:event_db}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate Einstellungen
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/db.changelog-master.xml

# Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${KC_HOST:localhost}:${KC_PORT:8080}/realms/${KC_REALM:EventKC}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${KC_INTERNAL_HOST:localhost}:${KC_PORT:8080}/realms/${KC_REALM:EventKC}/protocol/openid-connect/certs

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Logging (production: important events only)
logging.level.com.notif.backend=INFO
